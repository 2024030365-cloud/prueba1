services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: prueba
      DB_USERNAME: pruebaUser
      DB_PASSWORD: 1234567

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234567
      MYSQL_DATABASE: prueba
      MYSQL_USER: pruebaUser
      MYSQL_PASSWORD: 1234567
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: